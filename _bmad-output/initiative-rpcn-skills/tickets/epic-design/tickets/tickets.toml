# Epic 3 (Design skill): planned stories in build order. Table order is build order.

[[entry]]
id = 1
type = "story"
title = "Tracer: rpcn-design writes a ready note that Author builds and Test checks"
description = "Scaffolds rpcn-design (SKILL.md, references, shared format copies through shared.txt, scripts, trigger cases, an npx install), and adds multi-step chains to the scenario runner (a scenario runs several skill sessions in one folder, in order, with wall time summed). From a plain headless request, Design writes a ready <name>.design.md in design@1 whose components rpcn_check lists and fields report. Author builds it into a pipeline that lints clean, and Test's Design check reports no mismatch. Patterns are minimal here (error handling and the DLQ); the full set is story 2. Delivers R7's thin path; story 6 delivers it for every pattern family."
verify = "A chained headless scenario (Design, then Author, then Test) in a subfolder with a non-default name passes on 4.100.0 and 4.117.0: a ready note, a pipeline that lints clean, Design check with 0 mismatch. The trigger gate passes with rpcn-design's positive and near-miss cases, the runner's chain tests pass, and the validator is clean."
covers = ["R1", "R2", "R7", "R9"]
after = ["2.6", "2.10"]
hitl = false
risk = "high"

[[entry]]
id = 2
type = "story"
title = "Design recommends each pattern from a sourced fact"
description = "A patterns reference for DLQ, retries, batching, idempotency and ordering, distilled from the docs and the reference skill sets (each adapted piece with a SOURCES.md row and licence), each pattern naming the behaviour fact it rests on, proved on both binaries. Design names every pattern relevant to the request in the note."
verify = "Every pattern in the reference cites a SOURCES.md row proved by a real-binary test on 4.100.0 and 4.117.0; eval-case notes name each pattern relevant to their request (a scenario per pattern family)."
covers = ["R1", "R3"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "Design asks what only the user can decide"
description = "Interactive runs ask at most two short rounds, each question with its pick: always the failure target, the delivery guarantee, ordering and the idempotency key; everything else gets a default. An unanswered choice is [blocking] only when it changes components (failure target, delivery), else [non-blocking] with the pick written in. Shares one eval record with story 4: it only smoke-runs, and 3 and 4 are pushed together after 4's record (epic decision 2026-11-21)."
verify = "Interactive scenarios: one that asks the four questions, each with its pick, and writes no note; one whose prompt already carries the answers (as rpcn-author__ask_existing does) that writes a ready note; one that leaves the failure target open and writes a not-ready note with a [blocking] decision. The first reply holds the whole first round."
covers = ["R4"]
after = [2]
hitl = false
risk = "medium"

[[entry]]
