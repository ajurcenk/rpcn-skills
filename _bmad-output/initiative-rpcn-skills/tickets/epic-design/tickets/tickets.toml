title = "Headless Design writes a draft note with its open decisions"
description = "A headless run never asks: it writes a draft note listing each open decision and ends with the AD-8 status block. In a chain (story 1's runner support), rpcn-author treats the draft as not ready, as it already does. Its eval record also covers story 3, and 3 and 4 are pushed together."
verify = "A headless scenario on an ambiguous request: status draft, each open decision listed, status block complete with them in open_questions; rpcn-author then builds from the request alone and says the note is not ready."
covers = ["R5"]
after = [3]
hitl = false
risk = "low"

